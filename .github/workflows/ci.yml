name: CI Pipeline

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  backend-and-ml-tests:
    name: Backend, ML & Simulator Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r ml/requirements.txt
          pip install -r simulator/requirements.txt

      - name: Run Backend, ML, and Simulator Test Suites
        run: |
          pytest ml/tests/ backend/tests/ simulator/test_simulator.py -v

  frontend-check:
    name: Frontend Typecheck, Tests & Bundle Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Run Vitest Suite
        working-directory: frontend
        run: |
          npm run test -- --run

      - name: Verify Production Bundle Compilation
        working-directory: frontend
        run: |
          npm run build
