version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: btsmartdry-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: btsmartdry
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d btsmartdry"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: btsmartdry-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@db:5432/btsmartdry
      SECRET_KEY: dev_secret_key_change_in_production_min_32_chars_long
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      ENVIRONMENT: development
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      AFRICASTALKING_USERNAME: sandbox
      AFRICASTALKING_API_KEY: dummy_key
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: btsmartdry-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: btsmartdry-simulator
    restart: unless-stopped
    environment:
      - SIMULATOR_BACKEND_URL=http://backend:8000
      - SIMULATOR_INTERVAL_SECONDS=5
    volumes:
      - ./simulator:/app
    depends_on:
      - backend

volumes:
  pgdata:

